# One-click deploy on Render (https://render.com): New > Blueprint > pick this repo.
services:
  - type: web
    name: wedding-guestbook
    runtime: python
    plan: starter            # paid plan: needed for the disk below (free plan loses uploads on restart)
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: ADMIN_PASSWORD
        sync: false          # Render asks you to type it during setup
      - key: DATA_DIR
        value: /var/data
      - key: PYTHON_VERSION
        value: 3.12.7
    disk:
      name: guestbook-data
      mountPath: /var/data
      sizeGB: 1
