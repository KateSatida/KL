# Publishes the game to https://<your-username>.github.io/<repo>/ on every push to main.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build photo-booth frames (pixel couple, die-cut photo)
        run: pip install --quiet pillow && python tools/make_couple_frame.py
      - name: List art files
        run: python tools/build_manifest.py
      - name: Collect website files
        run: |
          mkdir _site
          cp -r index.html admin.html css js assets config _site/
          touch _site/.nojekyll
      - name: Stamp file versions (phones never mix old and new files after an update)
        run: |
          V=${GITHUB_SHA::8}
          sed -i -E "s#(href|src)=\"(css/style\.css|js/(main|admin)\.js)\"#\1=\"\2?v=$V\"#" _site/index.html _site/admin.html
          find _site/js -name '*.js' -exec sed -i -E "s#(from |import\()\"(\.{1,2}/[^\"]+\.js)\"#\1\"\2?v=$V\"#g" {} +
          grep -c "?v=$V" _site/index.html _site/admin.html _site/js/main.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
